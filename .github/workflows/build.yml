name: Quality and Packages

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: quality-packages-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONUNBUFFERED: "1"

jobs:
  quality:
    name: Linux quality gates
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libdbus-1-dev libglib2.0-dev pkg-config \
            libegl1 libopengl0 libxcb-cursor0
      - name: Install locked test dependencies
        run: |
          python -m pip install "pip==26.1.1"
          python -m pip install -r requirements-dev.lock
      - name: Compile check
        run: python -m compileall -q src tests
      - name: Ruff correctness checks
        run: ruff check src tests
      - name: Incremental type check
        run: mypy src/lyrics/lrc_parser.py src/meta_utils.py src/ui/color_utils.py
      - name: Unit and offscreen Qt tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: pytest -q

  windows-test:
    name: Windows tests
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - name: Install locked test dependencies
        shell: pwsh
        run: |
          python -m pip install "pip==26.1.1"
          python -m pip install -r requirements-dev.lock
      - name: Compile check
        run: python -m compileall -q src tests
      - name: Ruff correctness checks
        run: ruff check src tests
      - name: Unit tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: pytest -q

  linux-package:
    name: Linux package and smoke test
    needs: quality
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: Install native runtime and build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            python3-venv python3-dbus python3-gi gir1.2-glib-2.0 \
            libegl1 libopengl0 libxcb-cursor0
      - name: Build locked package
        run: bash scripts/build_linux.sh
      - name: Smoke-test packaged executable
        env:
          QT_QPA_PLATFORM: offscreen
        run: timeout 30s dist/Lyricaod/Lyricaod --help
      - name: Preserve executable permissions
        run: tar -czf dist/Lyricaod-linux.tar.gz -C dist Lyricaod
      - name: Upload tested package
        uses: actions/upload-artifact@v7
        with:
          name: Lyricaod-linux
          path: dist/Lyricaod-linux.tar.gz
          if-no-files-found: error

  windows-package:
    name: Windows package and smoke test
    needs: [quality, windows-test]
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-build.lock
      - name: Build locked package
        shell: pwsh
        run: .\scripts\build_windows.ps1
      - name: Smoke-test packaged executable
        shell: pwsh
        run: .\dist\Lyricaod\Lyricaod.exe --help
      - name: Create package archive
        shell: pwsh
        run: Compress-Archive -Path .\dist\Lyricaod -DestinationPath .\dist\Lyricaod-windows.zip -Force
      - name: Upload tested package
        uses: actions/upload-artifact@v7
        with:
          name: Lyricaod-windows
          path: dist/Lyricaod-windows.zip
          if-no-files-found: error
