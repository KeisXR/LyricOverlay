name: Build Packages

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

jobs:
  windows:
    name: Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build package
        shell: pwsh
        run: .\scripts\build_windows.ps1
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Lyricaod-windows
          path: dist/Lyricaod

  linux:
    name: Linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-venv python3-dbus python3-gi gir1.2-glib-2.0 libegl1 libopengl0 libxcb-cursor0
      - name: Build package
        run: bash scripts/build_linux.sh
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Lyricaod-linux
          path: dist/Lyricaod
