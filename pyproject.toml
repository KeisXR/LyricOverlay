[tool.pytest.ini_options]
minversion = "9.0"
testpaths = ["tests"]
addopts = "-ra -m 'not integration'"
markers = [
  "integration: requires an external service or a real desktop/media backend",
  "qt: requires a Qt application and normally runs with QT_QPA_PLATFORM=offscreen",
]

[tool.ruff]
target-version = "py312"
line-length = 100
exclude = [".venv", ".build-venv", ".build-work", "build", "dist"]

[tool.ruff.lint]
# Start with correctness rules so the quality gate can be introduced without
# mixing a repository-wide style rewrite into this infrastructure PR.
select = ["E9", "F63", "F7", "F82"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
warn_unused_configs = true
show_error_codes = true
pretty = true
